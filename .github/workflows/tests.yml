name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: pytest tests/ -v

      - name: CLI smoke test (Wiener A4, fresh archive)
        run: |
          ./leonardo-lab "Cybernetics A4 Genome" /tmp/ci_smoke.yaml | tee /tmp/report.txt
          grep -q "ALL 7 HARD GATES PASSED" /tmp/report.txt

      - name: CLI smoke test (archive resume, Generation 2)
        run: |
          ./leonardo-lab "Cybernetics A4 Genome" /tmp/ci_smoke.yaml | grep -q "Generation 2 Complete"
